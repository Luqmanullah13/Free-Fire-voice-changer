name: Android CI Verification

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  verify:
    name: Unit Tests & Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Environment & Keystore
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Debug Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxforge-ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
